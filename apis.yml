description: >-
  Gut Wellness Club is an India-based consumer wellness brand offering a "Gut Reset" program that
  promises to resolve digestive issues in 15-20 days using natural traditional foods, yoga, Ayurveda,
  and Naturopathy as an alternative to medication. The site is Wix-hosted and, notably for a consumer
  brand, exposes agent-native surfaces: a published /llms.txt and a live, hosted Wix Site MCP endpoint
  that lets AI agents retrieve business details, search the site, and access Wix REST APIs without
  scraping. It has no first-party developer API, OpenAPI, or SDKs. Surfaced via Accel portfolio mining
  and enriched from its real public agent surfaces.
